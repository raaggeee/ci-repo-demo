name: ci 

on: 
  push:
    branches:
      - main 

  pull_request:
    

jobs:
  linting:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        version: ["3.9", "3.10", "3.11"]


    steps:
      - name: code checkout
        uses: actions/checkout@v3

      - name: install python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.version }}

      - name: install deps 
        run: |
          python3 -m pip install --upgrade pip 
          pip install flake8

      - name: run flake8
        run: |
          flake8 app.py

  testing:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: :True

      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        version: ["3.9", "3.10", "3.11"]

    steps:
      - name: code checkout
        uses: actions/checkout@v3

      - name: install python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.version }}

      - name: install deps
        run: |
          python3 -m pip install --upgrade pip

      - name: unit test 
        run: | 
          python3 test.py
